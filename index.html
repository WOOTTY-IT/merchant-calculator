<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#1b1b1b">
  <title data-i18n="app.title">Merchant Calculator</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <noscript>
    <div class="card muted">JavaScript is required · แอปนี้ต้องใช้ JavaScript</div>
  </noscript>
  <header>
    <h1 class="header-title" data-i18n="app.title">Merchant Calculator</h1>
    <div class="lang">
      <select id="langSelect" aria-label="Language">
        <option value="th">ไทย</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <main>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="calc" data-i18n="tab.calc">Calculator</button>
      <button class="tab" data-tab="discount" data-i18n="tab.discount">Discount</button>
      <button class="tab" data-tab="pricing" data-i18n="tab.pricing">Pricing</button>
      <button class="tab" data-tab="cash" data-i18n="tab.cash">Cash</button>
      <button class="tab" data-tab="percent" data-i18n="tab.percent">Percent</button>
    </nav>

    <!-- Calculator -->
    <section class="tab-content active" id="calc">
      <div class="card">
        <div class="input-group">
          <label for="calcExpr" data-i18n="calc.expr">Expression</label>
          <input id="calcExpr" type="text" inputmode="decimal" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="e.g. 1+2*3">
        </div>
        <button class="btn-primary" id="calcBtn" data-i18n="common.calculate">Calculate</button>
        <div>
          <label data-i18n="calc.result">Result</label>
          <div class="result" id="calcResult">0</div>
        </div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <button class="btn-secondary" id="calcCopy" data-i18n="calc.copy">Copy</button>
          <button class="btn-secondary btn-danger" id="calcClear" data-i18n="calc.clear">Clear</button>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="calc.tape">Tape</h2>
        <div class="tape" id="tape"></div>
        <div class="muted" id="tapeEmpty" data-i18n="calc.tape.empty">No history yet...</div>
      </div>
    </section>

    <!-- Discount -->
    <section class="tab-content" id="discount">
      <div class="card">
        <div class="input-group">
          <label for="discPrice" data-i18n="discount.price">Original price</label>
          <input id="discPrice" type="number" step="0.01" inputmode="decimal">
        </div>
        <div class="tabs" style="margin-top: -0.25rem;">
          <button class="tab active" data-discmode="percent" data-i18n="discount.mode.percent">Percent off</button>
          <button class="tab" data-discmode="cash" data-i18n="discount.mode.cash">Cash off</button>
        </div>
        <div id="discPctRow" class="input-group">
          <label for="discPct" data-i18n="discount.percent">Discount %</label>
          <input id="discPct" type="number" step="0.01" inputmode="decimal" min="0" max="100">
        </div>
        <div id="discCashRow" class="input-group" style="display:none;">
          <label for="discCash" data-i18n="discount.amount">Discount amount</label>
          <input id="discCash" type="number" step="0.01" inputmode="decimal" min="0">
        </div>
        <button class="btn-primary" id="discCalc" data-i18n="common.calculate">Calculate</button>
        <div>
          <div class="muted" data-i18n="discount.result">You pay</div>
          <div class="result" id="discPay">0</div>
          <div class="muted" data-i18n="discount.saved">You save</div>
          <div id="discSave">0</div>
        </div>
      </div>
    </section>

    <!-- Pricing -->
    <section class="tab-content" id="pricing">
      <div class="card">
        <div class="input-group">
          <label for="priceCost" data-i18n="pricing.cost">Cost per item</label>
          <input id="priceCost" type="number" step="0.01" inputmode="decimal">
        </div>
        <div class="input-group">
          <label for="priceMarkup" data-i18n="pricing.markup">Markup % (on cost)</label>
          <input id="priceMarkup" type="number" step="0.01" inputmode="decimal">
        </div>
        <div class="input-group">
          <label for="priceMargin" data-i18n="pricing.margin">Margin % (on price)</label>
          <input id="priceMargin" type="number" step="0.01" inputmode="decimal" min="0" max="99.99">
        </div>
        <div class="input-group">
          <label for="priceFee" data-i18n="pricing.fee">Platform fee %</label>
          <input id="priceFee" type="number" step="0.01" inputmode="decimal">
        </div>
        <div class="input-group">
          <label for="priceVat" data-i18n="pricing.vat">Add VAT %</label>
          <input id="priceVat" type="number" step="0.01" inputmode="decimal" value="7">
        </div>
        <button class="btn-primary" id="priceCalc" data-i18n="common.calculate">Calculate</button>
        <div class="grid">
          <div><span class="muted" data-i18n="pricing.price">Selling price</span> <div id="priceSell">0</div></div>
          <div><span class="muted" data-i18n="pricing.feeAmount">Platform fee</span> <div id="priceFeeAmt">0</div></div>
          <div><span class="muted" data-i18n="pricing.profit">Profit per item</span> <div id="priceProfit">0</div></div>
          <div><span class="muted" data-i18n="pricing.vatAmount">VAT</span> <div id="priceVatAmt">0</div></div>
          <div><span class="muted" data-i18n="pricing.withVat">Price incl. VAT</span> <div id="priceInclVat">0</div></div>
        </div>
      </div>
    </section>

    <!-- Cash -->
    <section class="tab-content" id="cash">
      <div class="card">
        <div class="input-group">
          <label for="cashTotal" data-i18n="cash.total">Bill total</label>
          <input id="cashTotal" type="number" step="0.01" inputmode="decimal">
        </div>
        <div class="input-group">
          <label for="cashReceived" data-i18n="cash.received">Cash received</label>
          <input id="cashReceived" type="number" step="0.01" inputmode="decimal">
        </div>
        <div>
          <label data-i18n="cash.quick">Quick cash</label>
          <div class="quick-grid" id="quickCash"></div>
        </div>
        <button class="btn-primary" id="cashCalc" data-i18n="common.calculate">Calculate</button>
        <div>
          <span class="muted" data-i18n="cash.change">Change</span>
          <div class="result" id="cashChange">0</div>
          <div id="cashMsg" class="muted"></div>
        </div>
      </div>
    </section>

    <!-- Percent -->
    <section class="tab-content" id="percent">
      <div class="card">
        <div class="tabs" id="pctTabs">
          <button class="tab active" data-pct="of" data-i18n="percent.of">Percent of amount</button>
          <button class="tab" data-pct="add" data-i18n="percent.add">Amount + percent</button>
          <button class="tab" data-pct="reduce" data-i18n="percent.reduce">Amount − percent</button>
        </div>
        <div class="input-group">
          <label for="pctAmount" data-i18n="percent.value">Amount</label>
          <input id="pctAmount" type="number" step="0.01" inputmode="decimal">
        </div>
        <div class="input-group">
          <label for="pctPct" data-i18n="percent.percent">Percent</label>
          <input id="pctPct" type="number" step="0.01" inputmode="decimal">
        </div>
        <button class="btn-primary" id="pctCalc" data-i18n="common.calculate">Calculate</button>
        <div>
          <span class="muted" data-i18n="common.result">Result</span>
          <div class="result" id="pctResult">0</div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
